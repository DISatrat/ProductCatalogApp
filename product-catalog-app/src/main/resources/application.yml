spring:
  application:
    name: product-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_db?currentSchema=app_schema
    username: disa
    password: disa12
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    default-schema: app_schema
    liquibase-schema: liquibase_schema
    contexts: dev
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
